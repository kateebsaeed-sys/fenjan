<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>فنجان العائلة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: modelled on the original Seen Jeem app — white ground, a bold red→purple gradient band, chunky display type, pill-shaped point tiles and grey board columns. Team B is purple in the main game and gold in the letters game. */
:root{
  --bg:#ffffff; --surface:#f4f4f6; --surface-2:#e9e9ee; --line:#d9d9e0;
  --fg:#1f1b2b; --muted:#6c6878; --ink:#332d42;
  --red:#e3262e; --red-d:#b9161d; --purple:#6a2c9e; --purple-d:#521f7c; --gold:#e8a913; --gold-d:#b98407;
  --green:#178a48; --sky:#dcebf7; --navy:#1f2a7a;
  --amber:var(--purple); --amber-d:var(--purple-d); --on-amber:#fff;
  --grad:linear-gradient(100deg,#e3262e 0%,#c0234f 45%,#6a2c9e 100%);
  --display:"Lalezar","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
.lmode{--amber:var(--gold); --amber-d:var(--gold-d); --on-amber:#2a1c05}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6}
#app{min-height:100vh;padding-block:0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto;display:flex;flex-direction:column}
#app > .view{flex:1;padding-bottom:36px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.3;text-wrap:balance;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px;border-radius:8px}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--fg);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
textarea{resize:vertical;min-height:70px}
label{display:grid;gap:6px;font-size:14px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:999px;font-weight:700;background:#fff;border:1.5px solid var(--line);color:var(--fg);transition:transform .12s, background .12s, box-shadow .12s}
.btn:hover:not(:disabled){background:var(--surface)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.btn.primary:hover:not(:disabled){background:#cc1f27}
.btn.primary:active:not(:disabled){box-shadow:0 2px 0 var(--red-d);transform:translateY(2px)}
.btn.amber{background:var(--amber);border-color:var(--amber);color:var(--on-amber);box-shadow:0 4px 0 var(--amber-d)}
.btn.amber:hover:not(:disabled){filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 14px;font-size:14px;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.view{animation:fade .25s ease}
.still .view{animation:none}
.pickbar{position:sticky;bottom:12px;z-index:5;margin:18px auto 0;width:max-content;max-width:100%;display:flex;gap:14px;align-items:center;background:var(--ink);color:#fff;padding:8px 10px 8px 18px;border-radius:999px;box-shadow:0 10px 24px rgba(40,20,60,.25)}
.pickbar b{font-size:20px}
.pickbar .muted{color:#cfcbd8}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* top bar: light on menus, gradient on play screens (like the original) */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap;background:var(--surface);padding:10px 16px;border-radius:0 0 18px 18px}
.brand{display:flex;align-items:center;gap:10px;text-align:start}
.brand .logo{font-family:var(--display);font-size:30px;line-height:1;color:var(--red);display:flex;align-items:baseline;gap:6px}
.brand .logo i{font-style:normal;color:var(--purple)}
.brand small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500;display:block}
.view.game .topbar{background:var(--grad);color:#fff}
.view.game .brand .logo,.view.game .brand .logo i{color:#fff}
.view.game .brand small{color:rgba(255,255,255,.8)}
.view.game .topbar .btn{color:#fff;border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.12)}
.view.game .topbar .btn:hover{background:rgba(255,255,255,.24)}
.lmode.game .topbar{background:linear-gradient(100deg,var(--red) 0%,#d0531c 50%,var(--gold) 100%)}

/* home hero */
.hero{position:relative;background:var(--grad);color:#fff;border-radius:28px;padding:clamp(34px,6vw,64px) 20px 92px;text-align:center;overflow:hidden;display:grid;gap:10px;justify-items:center}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero::before{width:420px;height:420px;top:-180px;inset-inline-start:-120px}
.hero::after{width:300px;height:300px;bottom:-150px;inset-inline-end:-60px}
.hero h1{font-size:clamp(64px,13vw,132px);line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.14)}
.hero h1 small{display:block;font-size:.34em;opacity:.95;margin-top:4px}
.hero .tagline{font-family:var(--display);font-size:clamp(22px,3.6vw,32px);margin:0}
.hero p{max-width:56ch;margin:0;font-size:16px;opacity:.92}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:-62px auto 0;position:relative;z-index:1;max-width:900px;padding-inline:8px}
.mode{background:#fff;border-radius:20px;padding:18px 12px 16px;display:grid;justify-items:center;gap:8px;box-shadow:0 10px 24px rgba(40,20,60,.12);border:1.5px solid var(--surface-2);transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode .mi{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#fff;font-family:var(--display)}
.mode b{font-family:var(--display);font-weight:400;font-size:20px}
.mode span{font-size:12px;color:var(--muted)}
.mi.r{background:var(--red)} .mi.p{background:var(--purple)} .mi.g{background:var(--gold)} .mi.k{background:var(--ink)}
.stitle{text-align:center;margin:40px 0 8px}
.stitle h2{font-size:clamp(28px,4vw,38px)}
.stitle h2 em{font-style:normal;color:var(--red)}
.stitle p{margin:4px 0 0;color:var(--muted)}
.group{background:var(--surface);border-radius:24px;padding:42px 16px 18px;position:relative;margin-top:34px}
.ghead{position:absolute;top:-18px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--red);color:#fff;font-family:var(--display);font-size:20px;padding:6px 26px;border-radius:999px;box-shadow:0 4px 0 var(--red-d)}
.ghead.p{background:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.ghead.g{background:var(--gold);color:#2a1c05;box-shadow:0 4px 0 var(--gold-d)}
.helpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.hcard{background:#fff;border-radius:18px;padding:18px 14px;display:grid;justify-items:center;gap:8px;text-align:center}
.hcard .ci{width:64px;height:64px;border-radius:50%;border:3px solid var(--red);display:grid;place-items:center;font-size:28px}
.hcard b{background:var(--ink);color:#fff;padding:3px 16px;border-radius:999px;font-weight:600;font-size:15px}
.hcard span{font-size:13px;color:var(--muted)}
.foot{margin-top:40px;background:#3b3a40;color:#e7e6ea;border-radius:22px 22px 0 0;padding:22px 18px;text-align:center;font-size:14px}
.foot b{font-family:var(--display);font-weight:400;font-size:24px;color:#fff;display:block}

/* panels / setup */
.panel{background:var(--surface);border-radius:22px;padding:22px}
.setup{display:grid;gap:18px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.team-in{border:2px solid var(--red);font-weight:700;font-size:18px}
.team-in.b{border-color:var(--amber)}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.catpick{position:relative;text-align:center;padding:0;border-radius:16px;background:#fff;border:3px solid transparent;display:grid;grid-template-rows:auto auto;overflow:hidden;box-shadow:0 3px 10px rgba(40,20,60,.08);transition:transform .12s}
.catpick:hover:not(:disabled){transform:translateY(-2px)}
.catpick .vis{background:var(--sky);aspect-ratio:1.15;display:grid;place-items:center;overflow:hidden;position:relative}
.catpick .vis img{width:100%;height:100%;object-fit:cover;display:block}
.catpick .ic{font-size:46px;line-height:1}
.catpick .nm{font-family:var(--display);font-size:17px;background:var(--red);color:#fff;padding:6px 6px 4px;line-height:1.3;overflow-wrap:anywhere}
.catgrid > .catpick:nth-child(3n+2) .nm{background:var(--purple)}
.catgrid > .catpick:nth-child(3n) .nm{background:var(--ink)}
.lettergrid > .catpick .nm{background:var(--gold)!important;color:#2a1c05}
.lettergrid > .catpick:nth-child(even) .nm{background:var(--red)!important;color:#fff}
.catpick .ct{position:absolute;top:8px;inset-inline-start:8px;font-size:11px;font-weight:700;background:rgba(255,255,255,.92);color:var(--fg);padding:2px 9px;border-radius:999px}
.catpick[aria-pressed="true"]{border-color:var(--red)}
.lmode .catpick[aria-pressed="true"]{border-color:var(--gold)}
.catpick[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;inset-inline-end:8px;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;box-shadow:0 0 0 3px #fff}
.lmode .catpick[aria-pressed="true"]::after{background:var(--gold);color:#2a1c05}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec-h h2{font-size:26px}
.count{font-variant-numeric:tabular-nums;font-weight:700;color:#fff;background:var(--red);padding:2px 12px;border-radius:999px;font-size:14px}
.startbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;background:var(--surface);border-radius:22px;padding:16px}
.startbar .btn.primary{font-size:20px;padding:14px 46px;background:var(--grad);border:0}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch;margin-bottom:18px}
.tm{background:var(--surface);border-radius:20px;padding:12px 14px;display:grid;gap:8px;position:relative;justify-items:center;text-align:center;border:3px solid transparent}
.tm.turn{border-color:var(--red)}
.tm.b.turn{border-color:var(--amber)}
.tm .nm{font-family:var(--display);font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;max-width:100%;background:var(--red);color:#fff;padding:4px 18px;border-radius:999px;width:100%}
.tm.b .nm{background:var(--amber);color:var(--on-amber)}
.tm .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm .badge{font-family:var(--body);font-size:12px;background:#fff;color:var(--fg);padding:1px 8px;border-radius:20px;white-space:nowrap;font-weight:600}
.tm .pts{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;min-width:2.4ch}
.tm .ptsrow{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
.adj{display:contents}
.adj button{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:20px;line-height:1}
.tm.b .adj button{background:var(--amber);color:var(--on-amber)}
.adj button:first-child{order:-1}
.helpers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.hp{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:#fff;border:2px solid var(--red);font-size:13px;font-weight:600}
.tm.b .hp{border-color:var(--amber)}
.hp.used{text-decoration:line-through;opacity:.35;border-color:var(--line)!important}
.hp.on{background:var(--green);border-color:var(--green)!important;color:#fff}
.mid{display:grid;align-content:center;justify-items:center;gap:6px;text-align:center;padding-inline:4px}
.mid .left{font-size:13px;color:var(--muted)}
.mid .left b{font-size:22px;color:var(--fg);font-variant-numeric:tabular-nums;display:block}

/* board: grey column, cover in the middle, pill points either side */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{background:var(--surface-2);border-radius:20px;padding:12px;display:grid;gap:12px}
.col h3{display:flex;align-items:center;gap:10px;font-size:19px;justify-content:center;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:14px 0;border-radius:999px;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;background:#fff;color:var(--red);position:relative;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.tile:hover:not(:disabled){background:var(--red);color:#fff}
.tile.used{color:transparent;opacity:1;background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.tile.used::after{content:"";position:absolute;inset:0;margin:auto;width:14px;height:14px;border-radius:50%;background:var(--muted)}
.tile.used.ta::after{background:var(--red)} .tile.used.tb::after{background:var(--amber)}

/* question */
.qwrap{display:grid;gap:18px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.qhead .cat{font-family:var(--display);font-size:24px;display:flex;gap:10px;align-items:center}
.pill{padding:4px 16px;border-radius:999px;font-family:var(--body);font-weight:700;font-size:18px;background:var(--red);color:#fff;font-variant-numeric:tabular-nums}
.qcard{background:#fff;border:2px solid var(--surface-2);box-shadow:0 10px 30px rgba(40,20,60,.08);border-radius:26px;padding:clamp(20px,4vw,44px);display:grid;grid-template-columns:minmax(0,1fr);gap:20px;justify-items:center;text-align:center;box-shadow:inset 0 8px 0 var(--red),0 10px 30px rgba(40,20,60,.08)}
.qtext{font-family:var(--body);font-weight:700;font-size:clamp(24px,4vw,42px);max-width:28ch;line-height:1.5}
.qemoji{font-size:clamp(70px,14vw,150px);line-height:1.15;letter-spacing:.08em}
.qimg{max-width:100%;height:auto;max-height:46vh;object-fit:contain;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.answer{background:var(--green);color:#fff;border-radius:999px;padding:12px 30px;font-family:var(--display);font-size:clamp(24px,3.4vw,38px);line-height:1.4}
.timer{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ring{--p:100;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--purple) calc(var(--p)*1%), var(--surface-2) 0);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.lmode .ring{background:conic-gradient(var(--gold) calc(var(--p)*1%), var(--surface-2) 0)}
.ring span{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center}
.ring.low,.lmode .ring.low{background:conic-gradient(var(--red) calc(var(--p)*1%), var(--surface-2) 0)}
.ring.out span{color:var(--red)}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px;width:100%;max-width:720px}
.who .btn{padding:16px;font-size:18px}
.notice{background:#eef8f1;border:1.5px dashed var(--green);color:#0f5a2f;border-radius:12px;padding:8px 14px;font-size:14px}

/* end */
.end{text-align:center;display:grid;gap:18px;justify-items:center;padding:44px 16px;background:var(--grad);color:#fff;border-radius:28px}
.end h1{font-size:clamp(44px,8vw,84px)}
.end .muted{color:rgba(255,255,255,.85)}
.final{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.final div{background:#fff;color:var(--fg);border-radius:20px;padding:16px 28px;min-width:180px}
.final b{display:block;font-size:44px;font-variant-numeric:tabular-nums}
.stripe{display:flex;width:180px;height:8px;border-radius:4px;overflow:hidden}
.stripe i{flex:1}

/* admin */
.admin{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.catlist{display:grid;gap:6px}
.catlist button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:10px 12px;border-radius:12px;border:1.5px solid transparent}
.catlist button[aria-current="true"]{background:#fff;border-color:var(--red)}
.catlist .n{flex:1;min-width:0}
.catlist .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.qlist{display:grid;gap:8px;margin-top:14px}
.qi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.qi .lv{font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;background:var(--red);color:#fff;white-space:nowrap}
.qi .t{min-width:0}
.qi .t div{overflow-wrap:anywhere}
.qi .a{font-size:13px;color:var(--green);font-weight:600}
.qi img{width:46px;height:46px;object-fit:cover;border-radius:8px;vertical-align:middle}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:10px;white-space:nowrap}
.form{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form .full{grid-column:1/-1}
.status{font-size:14px;min-height:1.4em}
.status.err{color:var(--red)} .status.ok{color:var(--green)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fdecec;border:1.5px solid var(--red);color:var(--fg);padding:8px 12px;border-radius:14px;font-size:14px}
.preview{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.mprev{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}
.mopts{display:grid;gap:10px;min-width:0;flex:1 1 220px;align-content:start}
.pv{max-width:min(320px,100%);max-height:200px;border-radius:10px;border:1px solid var(--line);background:#000}
.mprev audio{max-width:100%}
label.check{display:flex;align-items:center;gap:10px;color:var(--fg);font-size:15px;cursor:pointer}
label.check input{width:20px;height:20px;padding:0;accent-color:var(--red)}
.usage{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:6px;font-size:14px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad)}
.mwrap{display:grid;justify-items:center;gap:12px;width:100%}
.qvideo{width:100%;max-width:880px;max-height:56vh;border-radius:16px;background:#000}
.mwrap audio{width:100%;max-width:520px}
.disc{font-size:64px;width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#fff}
.playbtn{font-size:18px;padding:14px 30px}
.watchmsg{font-family:var(--display);font-size:clamp(22px,3vw,32px);color:var(--purple)}

/* board column layout */
.board .col{display:grid;grid-template-columns:76px minmax(0,1fr) 76px;gap:10px;padding:12px;align-items:stretch}
.side{display:grid;grid-template-rows:repeat(3,1fr);gap:8px}
.side .tile{padding:0;min-height:50px}
.cover{display:grid;grid-template-rows:minmax(0,1fr) auto;border-radius:14px;overflow:hidden;background:var(--sky);min-height:170px;min-width:0}
.cover img{width:100%;height:100%;object-fit:cover;min-height:0;display:block}
.cover .ic{display:grid;place-items:center;font-size:58px}
.board .cover h3{font-size:17px;padding:6px 6px 4px;background:var(--red);color:#fff;text-align:center;display:block;overflow-wrap:anywhere}
.board .col:nth-child(even) .cover h3{background:var(--purple)}
.catpick .thumb{width:100%;height:100%;object-fit:cover}
.catpick img.icon3d,.cover img.icon3d{object-fit:contain;padding:13%;filter:drop-shadow(0 8px 10px rgba(30,50,90,.18))}

 {id:"mind-riddles", name:"ألغاز وحزاوي", icon:"🧩", qs:[
  [1, "له أسنان وما يعض. وش هو؟", "المشط", ""],
  [1, "يستر الناس وهو عاري. وش هو؟", "الإبرة (تخيط ثيابهم)", ""],
  [1, "له رقبة وما له رأس. وش هو؟", "الزجاجة (القارورة)", ""],
  [1, "شيء لازم تكسره قبل ما تستعمله. وش هو؟", "البيضة", ""],
  [1, "له أوراق وما هو شجرة، وله جلد وما هو حيوان. وش هو؟", "الكتاب", ""],
  [1, "يمشي وراك وين ما رحت في الشمس، ويختفي في الظلام. وش هو؟", "الظل", ""],
  [1, "كل ما أخذت منه كِبر. وش هو؟", "الحفرة", ""],
  [1, "يمشي بلا رجلين، ويبكي بلا عيون. وش هو؟", "السحاب (الغيم)", ""],
  [1, "تحمله ويحملك. وش هو؟", "الحذاء (النعال)", ""],
  [1, "ينام وعيونه مفتوحة. وش هو؟", "السمك (ما له جفون)", ""],
  [1, "ما له لسان، بس يقول لك الصدق ويوريك عيوبك. وش هو؟", "المراية", ""],
  [1, "تحس فيه وما تشوفه، يحرك الشجر وما له يدين. وش هو؟", "الريح (الهواء)", ""],
  [1, "تشتريه أسود، وتستعمله أحمر، وترميه رمادي. وش هو؟", "الفحم", ""],
  [1, "كل ما غسلت فيه زاد وساخة. وش هو؟", "الماء", ""],
  [1, "له ثلاث عقارب، وما يلدغ. وش هو؟", "الساعة", ""],
  [2, "شيء تشوفه في «الليل» ثلاث مرات، وفي «النهار» مرة وحدة. وش هو؟", "حرف اللام", ""],
  [2, "«أول زماني لولو أبيض، ثاني زماني زمرد أخضر، ثالث زماني ياقوت أحمر». فسّر يا أسمر؟", "التمر (مراحل نضجه: طلع أبيض، ثم خلال أخضر، ثم بسر أحمر)", ""],
  [2, "«غنيمات سود في البطح رقود، إذا اهتز العود زاد الغنم سود». وش هي؟", "الحروف وقت الكتابة بالقلم", ""],
  [2, "أنشدك عن شي، الشر في بطنه والخير في ظهره؟", "الصاج (النار تحته والخبز فوقه)", ""],
  [2, "أنشدك عن شي أوسع ما فيه فمه، وولده في بطنه يرفسه ويلكمه، ويعلى صياحه وما حد يرحمه؟", "الجرس (ولده المطرقة الصغيرة اللي داخله)", ""],
  [2, "«وقاضٍ قد قضى في الناس عدلاً، له كفٌّ وليس له بنانُ». من هو؟", "الميزان (كفّه هي كفّة الميزان)", ""],
  [2, "«وآكلةٍ بغير فمٍ وبطنٍ، لها الأشجارُ والحيوانُ قوتُ. إذا أطعمتها انتعشت وعاشت، وإن سقّيتها ماءً تموتُ». وش هي؟", "النار", ""],
  [2, "يدور حول البيت كله، وهو ما يتحرك من مكانه. وش هو؟", "السور", ""],
  [2, "«طير طار في البحار، ما له ريش ولا منقار، عيونه حبة كزبرة، ورجوله مثل المنشار». وش هو؟", "الجرادة", ""],
  [2, "شيء دايماً قدامك، بس عمرك ما تشوفه. وش هو؟", "المستقبل", ""],
  [2, "كل ما طال عمره قصر طوله. وش هو؟", "الشمعة", ""],
  [2, "تشوفه في الماء، وما يبتل. وش هو؟", "الانعكاس (صورتك أو الظل في الماء)", ""],
  [2, "حرف يجي مرة في «أحمد»، ومرتين في «محمد». وش هو؟", "الميم", ""],
  [2, "«أنا ابن الماء، فإن تركوني في الماء متّ». من أنا؟", "الثلج (ويُقبل الملح)", ""],
  [2, "شي لو حطيته في الثلاجة، يبقى حار. وش هو؟", "الفلفل الحار", ""],
  [3, "أنشدك يا ويش شي فيه خمسة رياجيل، لا إنس ولا جان، أولهم إليا مات صاروا ثمان؟", "اسم «عثمان» (خمسة حروف، احذف الأول تصير «ثمان»)", ""],
  [3, "«ميت ما تبشلشه، جاه الحي وانبشه، قام عليه الميت واكبشه». وش هو؟", "المحبالة (الفخ): الطير الحي ينبشها فتطبق عليه", ""],
  [3, "سأل امرؤ القيس: «ما حبّةٌ ميتةٌ أحيت بميتتها، درداءُ ما أنبتت سنّاً وأضراسا؟». وش الجواب؟", "حبة الشعير (تُدفن في الأرض فتنبت سنبلة)", ""],
  [3, "«اسمُ من قد هويتُه ظاهرٌ في حروفه، فإذا زال ربعُه زال باقي حروفه». وش الاسم؟", "غزال (احذف الغين يبقى «زال»)", ""],
  [3, "«وذي خضوعٍ راكعٍ ساجدٍ، ودمعُه من جفنه جاري، ملازمِ الخمسِ لأوقاتها». وش هو؟", "القلم (دمعه الحبر، والخمس هي الأصابع)", ""],
  [3, "«خرساءُ لم ينطق بحرفٍ لسانُها، سوى صوتِ عرقٍ نابضٍ بحشاها، وبانت مواقيتُ الورى بعماها». وش هي؟", "الساعة (النبض هو التكتكة)", ""],
  [3, "«يرعى في حضيض الأرض طوراً، وتارةً تراه تسامى فوق طَور السحائبِ». وش هو؟", "الماء (يجري في الأرض ثم يصعد بخاراً)", ""],
  [3, "حيوان مفترس، إذا حذفت أول حرف منه صار حاجزاً يحبس الماء. وش هو؟", "الأسد (بدون الألف: سد)", ""],
  [3, "أخضر في الأرض، أسود في السوق، أحمر في البيت. وش هو؟", "الشاي (ورقه أخضر، ويُباع أسود، ويصير أحمر لما يُصب)", ""],
  [3, "شيء اسمه على لونه. وش هو؟", "البيض (أبيض)", ""],
  [3, "شي إذا أكلته كله استفدت، وإذا أكلت نصه متّ. وش هو؟", "السمسم (نصه «سم»)", ""],
  [3, "ولاية عُمانية، إذا حذفت آخر حرف منها صارت حرف جر. وش هي؟", "منح (بدون الحاء: من)", ""],
  [3, "قال النبي ﷺ: «إن من الشجر شجرة لا يسقط ورقها، وإنها مثل المسلم». وش هي؟", "النخلة (رواه البخاري)", ""],
  [3, "طائر، إذا حذفت أول حرف منه صار «سنة». وش هو؟", "النعام (بدون النون: عام)", ""],
  [3, "له رقبة وما له رأس، وله يدين وما له أصابع. وش هو؟", "الثوب (القميص)", ""]
 ]},
 {id:"mind-logic", name:"ألغاز منطقية", icon:"🧠", qs:[
  [1, "رجل عنده 4 بنات، ولكل بنت أخ واحد. كم عدد أولاده كلهم؟", "5 (4 بنات وولد واحد، هو أخو الكل)", ""],
  [1, "في سباق، تجاوزت صاحب المركز الثاني. في أي مركز صرت؟", "الثاني (أخذت مكانه، والأول باقي قدامك)", ""],
  [1, "في غرفة 4 زوايا، في كل زاوية قطة، وقدام كل قطة 3 قطط. كم قطة في الغرفة؟", "4 قطط", ""],
  [1, "سالم عنده 5 أخوات، وكل أخت عندها أخ واحد. كم أخ عند سالم؟", "ولا واحد (سالم هو الأخ الوحيد)", ""],
  [1, "راعي غنم عنده 17 خروف، ماتت كلها إلا 9. كم خروف بقي؟", "9", ""],
  [1, "أخت خالك، وليست خالتك. من هي؟", "أمك", ""],
  [1, "ابن أبوك وابن أمك، وليس أخاك. من هو؟", "أنت", ""],
  [1, "قطار كهربائي ماشي ناحية الشمال، والريح جاية من الشمال. على أي جهة يروح دخان القطار؟", "ما له دخان، كهربائي!", ""],
  [1, "6 عصافير على شجرة، صاد الصياد واحد منها. كم عصفور بقي على الشجرة؟", "ولا واحد (الباقي طاروا من الصوت)", ""],
  [1, "في طابور، أنت الخامس من قدام والخامس من ورا. كم واحد في الطابور؟", "9", ""],
  [1, "«أنا أخوك، وأنت مو أخوي». كيف؟", "لأنك أختي", ""],
  [1, "سعيد أقصر من سالم، وسالم أقصر من مازن. من الأطول؟", "مازن", ""],
  [1, "خشبة تبي تقصها 10 قطع، وكل قصة تاخذ دقيقة. كم دقيقة تحتاج؟", "9 دقائق (9 قصات تعطيك 10 قطع)", ""],
  [1, "سياج مستقيم طوله 10 أمتار، وفي عمود كل متر من أوله لآخره. كم عمود؟", "11 عمود", ""],
  [1, "في يدك 10 أصابع. كم إصبع في 10 أيادي؟", "50 (كل يد فيها 5)", ""],
  [2, "في سباق، تجاوزت آخر واحد. في أي مركز صرت؟", "مستحيل! ما أحد وراء الأخير عشان تتجاوزه", ""],
  [2, "عندك 10 شمعات مشتعلة، وأطفأت 3 منها. كم شمعة تبقى في النهاية؟", "3 (المشتعلة تذوب وتخلص، والمطفأة تبقى)", ""],
  [2, "معك ذئب وماعز وحزمة برسيم، وقارب ما يشيل إلا أنت وواحد منهم. الذئب ياكل الماعز، والماعز تاكل البرسيم لو تركتهم بروحهم. كم عبوراً تحتاج على الأقل عشان توصلهم كلهم؟", "7 (الماعز أولاً، ثم الذئب وترجع بالماعز، ثم البرسيم، ثم ترجع وتاخذ الماعز)", ""],
  [2, "3 صناديق مكتوب عليها «تمر» و«حلوى» و«مخلوط»، وكل الملصقات غلط. من أي صندوق تسحب قطعة وحدة عشان تعرف محتوى الثلاثة؟", "من صندوق «مخلوط»: أكيد مو مخلوط، فالقطعة تكشف محتواه، والباقي ينعرف بالاستنتاج", ""],
  [2, "3 مفاتيح كهرباء في غرفة، ومصباح في غرفة ثانية، وما تقدر تدخل غرفة المصباح إلا مرة وحدة. كيف تعرف مفتاحه؟", "شغّل الأول دقائق ثم طفّه وشغّل الثاني وادخل: لو مضيء فهو الثاني، لو مطفأ وحار فهو الأول، لو مطفأ وبارد فهو الثالث", ""],
  [2, "5 مكائن تصنع 5 قطع في 5 دقائق. كم دقيقة تحتاج 100 مكينة عشان تصنع 100 قطعة؟", "5 دقائق (كل مكينة تصنع قطعة في 5 دقائق)", ""],
  [2, "نبتة في بركة تتضاعف كل يوم، وتغطي البركة كلها في اليوم 48. في أي يوم غطّت نص البركة؟", "اليوم 47", ""],
  [2, "في درج 5 جوارب سوداء و5 بيضاء، والغرفة ظلام. كم جورب لازم تسحب على الأقل عشان تضمن زوج بنفس اللون؟", "3 جوارب", ""],
  [2, "عائلة فيها أب وأم و4 أولاد، ولكل ولد أخت وحدة. كم فرد في العائلة؟", "7 (أب وأم و4 أولاد وبنت وحدة)", ""],
  [2, "لما كان عمري 6 سنين، كان عمر أختي نص عمري. الحين عمري 40. كم عمر أختي؟", "37 (الفرق بيننا 3 سنين ما يتغير)", ""],
  [2, "5 بنات في غرفة: وحدة تقرأ، ووحدة تطبخ، ووحدة تلعب شطرنج، ووحدة تكتب. وش تسوي الخامسة؟", "تلعب شطرنج مع الثالثة", ""],
  [2, "علي أسرع من حمد، وحمد أبطأ من سعيد. من الأسرع؟", "ما نقدر نعرف (علي أو سعيد)", ""],
  [2, "في كيس 3 كرات حمراء و3 زرقاء. بدون ما تشوف، كم كرة لازم تسحب عشان تضمن كرتين حمر؟", "5 كرات (ممكن أول 3 يطلعون زرق)", ""],
  [2, "ساعة تدق 6 دقات في 5 ثواني. كم ثانية تحتاج عشان تدق 12 دقة؟", "11 ثانية (الوقت بين الدقات، مو الدقات)", ""],
  [2, "3 قطط تصيد 3 فيران في 3 دقائق. كم قطة تحتاج عشان تصيد 100 فار في 100 دقيقة؟", "3 قطط", ""],
  [3, "في جزيرة: الصادق ما يكذب أبداً، والكاذب ما يصدق أبداً. قال (أ): «أنا و(ب) كلنا كاذبين». وش حقيقة كل واحد؟", "(أ) كاذب و(ب) صادق. لو كان (أ) صادق ما يقدر يقول إنه كاذب، فهو كاذب، وكلامه غلط، يعني (ب) صادق", ""],
  [3, "8 كرات متشابهة، وحدة منها أثقل شوي، ومعك ميزان بكفتين. كم وزنة تحتاج على الأقل عشان تضمن تعرفها؟", "وزنتين: 3 مقابل 3 وتخلي 2 برا. لو تعادلت قارن الاثنتين، ولو مالت قارن 2 من الثلاث الأثقل", ""],
  [3, "10 أكياس عملات، كل قطعة 10 غرامات إلا كيس واحد قطعه 9 غرامات. معك ميزان رقمي ووزنة وحدة بس. كيف تعرف الكيس؟", "خذ قطعة من الكيس الأول، وقطعتين من الثاني… و10 من العاشر، وزنها كلها. الكامل 550 غرام، وعدد الغرامات الناقصة هو رقم الكيس", ""],
  [3, "رجل يطالع صورة ويقول: «ما عندي إخوان ولا خوات، وأبو هذا الرجل هو ولد أبوي». من اللي في الصورة؟", "ولده («ولد أبوي» هو المتكلم نفسه)", ""],
  [3, "3 أبواب، ورا واحد منها جائزة. اخترت باب، فالمقدّم (وهو يعرف وين الجائزة) فتح باب ثاني فاضي. هل الأفضل تغيّر اختيارك؟", "إيه، غيّر! التغيير يربح باحتمال 2 من 3، والبقاء 1 من 3 (مسألة مونتي هول)", ""],
  [3, "كم شخص على الأقل لازم يكونون في غرفة عشان يصير احتمال إن اثنين منهم يشتركون في يوم الميلاد أكثر من النص؟", "23 شخص (مفارقة أعياد الميلاد)", ""],
  [3, "قدامك بابين: واحد للنجاة وواحد للهلاك، وعندهم حارسين: واحد دايماً يصدق وواحد دايماً يكذب، وما تعرف مين. لك سؤال واحد لحارس واحد. وش تسأل؟", "اسأل أي واحد: «لو سألت صاحبك وين باب النجاة، وش بيقول؟»، وبعدين ادخل الباب الثاني", ""],
  [3, "عندك إناء 3 لتر وإناء 5 لتر، وماء بلا حدود. كيف تقيس 4 لتر بالضبط؟", "عبّ الـ5 وصب منه في الـ3 (يبقى 2). فرّغ الـ3 وحط فيه الـ2. عبّ الـ5 وكمّل منه الـ3 (يحتاج لتر واحد)، فيبقى في الـ5 أربعة لتر", ""],

  [3, "أب وزنه 80 كيلو وولدين كل واحد 40 كيلو، والقارب ما يشيل أكثر من 80 كيلو. كيف يعبرون كلهم النهر؟", "يعبر الولدين، يرجع واحد، يعبر الأب، يرجع الولد الثاني، ثم يعبر الولدين مع بعض (5 عبورات)", ""],
  [3, "خالد عنده إخوان بعدد خواته. وأخته منى عندها إخوان ضعف خواتها. كم ولد وكم بنت في العائلة؟", "4 أولاد و3 بنات", ""],
  [3, "بيت جدرانه الأربعة كلها تطالع الجنوب، ومر دب جنبه. وش لون الدب؟", "أبيض (البيت في القطب الشمالي)", ""],
  [3, "قالوا لرجل: «قل جملة، إذا كانت صادقة تنسجن، وإذا كانت كاذبة تنطرد من البلد». وش يقول عشان ما يصير له شي؟", "«أنا بنطرد من البلد» (لو صادقة لازم ينطرد، ولو كاذبة لازم ينسجن، فما يقدرون يسوون شي)", ""],
  [3, "3 أصحاب دفعوا 30 ريال للفندق، كل واحد 10. رجع لهم 5، فأخذ كل واحد ريال وعطوا الموظف 2. يعني كل واحد دفع 9: 27 + 2 = 29. وين الريال الناقص؟", "ما في ريال ناقص: الـ27 فيها الـ2 حق الموظف (25 للفندق + 2). الصح 27 + 3 = 30", ""],
  [3, "سلحفاة في بير عمقه 10 أمتار، كل نهار تطلع 3 أمتار، وكل ليل تنزلق مترين. بعد كم يوم تطلع؟", "8 أيام (بعد 7 أيام توصل 7 أمتار، وفي اليوم الثامن تطلع)", ""]
 ]},

/* The link carries the picture id and the answer itself, so the phone needs no database read:
   #w-<asset id>-<answer as base64url>. Older links (#w-<question id>) still work. */
function b64u(str){ const bytes = new TextEncoder().encode(String(str||"")); let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b)); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(s){ try{ s = s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length % 4) s += "="; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }catch(e){ return ""; } }
function secretLink(q){
  if(q && /^https?:\/\//.test(q.qrLink||"")) return q.qrLink;
  const m = mediaOf(q);
  if(m && m.kind==="image" && /^[0-9a-f]{32}$/.test(m.id)) return ART_URL + "#w-" + m.id + "-" + b64u(q.a);
  return q && /^[A-Za-z0-9._~-]{1,120}$/.test(q.id||"") ? ART_URL + "#w-" + q.id : "";
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* Question history: a question counts as "used" once it is opened in a game. New games pick unused
   questions first; when every question of a level in a category has been seen, that level starts a new cycle.
   The history lives on this device and, for editors, in the site's database so every device shares it. */
let usedRemote = [], usedSyncT = null;
function usedSet(){ return new Set([...(lsGet(LSU) || []), ...usedRemote]); }
function syncUsed(){
  if(!(store.db && store.canEdit)) return;
  clearTimeout(usedSyncT);
  usedSyncT = setTimeout(() => { store.db.doc("meta/used").set({ids:[...usedSet()].slice(-4000), at:Date.now()}).catch(()=>{}); }, 1500);
}
function markUsed(id){
  if(!id) return;
  const u = lsGet(LSU) || [];
  if(!u.includes(id)){ u.push(id); lsSet(LSU, u.slice(-4000)); }
  if(!usedRemote.includes(id)) usedRemote = usedRemote.concat(id);
  syncUsed();
}
function forgetUsed(ids){
  const rm = new Set(ids);
  lsSet(LSU, (lsGet(LSU) || []).filter(x=>!rm.has(x)));
  usedRemote = usedRemote.filter(x=>!rm.has(x));
  syncUsed();
}
function pickQuestions(catId, used){
  const pool = questionsOf(catId);
  const out = [], taken = new Set();
  for(const lv of [1,1,2,2,3,3]){
    let lvPool = pool.filter(q=>q.level===lv && !taken.has(q.id));
    if(!lvPool.length) lvPool = pool.filter(q=>!taken.has(q.id));
    let fresh = lvPool.filter(q=>!used.has(q.id));
    // no unseen question at this level: borrow an unseen one from another level before repeating
    if(!fresh.length) fresh = pool.filter(q=>!taken.has(q.id) && !used.has(q.id));
    if(!fresh.length && lvPool.length){
      // everything at this level was played before: start a new round for it
      const ids = pool.filter(q=>q.level===lv).map(q=>q.id);
      forgetUsed(ids); ids.forEach(id=>used.delete(id));
      fresh = lvPool;
    }
    const q = shuffle(fresh)[0];
    if(q){ taken.add(q.id); out.push({qid:q.id, pts:LEVEL_PTS[lv], used:false, by:null}); }
  }
  return out;
}

/* ---------- Hints (تلميحات): 1 مجاني · 2 قوي ينقّص النقاط · 3 يقرّب الجواب ---------- */
const HINT_PTS = {200:[100,50], 400:[200,100], 600:[400,200]};
function hintPts(q, t){
  const h = (q && q.hints) || {}, d = HINT_PTS[t.pts] || [Math.round(t.pts/2), Math.round(t.pts/4)];
  return [typeof h.p2==="number" ? h.p2 : d[0], typeof h.p3==="number" ? h.p3 : d[1]];
}
function curPts(t){ return game && game.cur && game.cur.hintPts!=null ? game.cur.hintPts : t.pts; }
function useHint(n){

  const t = game.board[game.cur.cat][game.cur.idx];

  saveGame(); render();
}
function hintsHTML(q, cur, t){

  const card = (k, title, txt) => `<div class="hintcard h${k}"><b>${title}</b><span>${esc(txt)}</span></div>`;
  const shown = [];
  if(n>=1 && h.h1) shown.push(card(1, "💡 تلميح ١ · مجاني", h.h1));

/* fireworks overlay for the winner */
let fwStop = null;
function fireworks(ms = 7000){
  try{ if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return; }catch(e){}
  if(fwStop) fwStop();
  const cv = document.createElement("canvas"); cv.className = "fw"; cv.setAttribute("aria-hidden","true"); document.body.appendChild(cv);
  const ctx = cv.getContext("2d"); if(!ctx){ cv.remove(); return; }
  const dpr = Math.min(2, window.devicePixelRatio || 1); let W = 0, H = 0;
  const size = () => { W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); };
  size(); addEventListener("resize", size);
  const colors = ["#e3262e","#6a2c9e","#e8a913","#17a35a","#ff5fa2","#2f7de1"];
  const pick = () => colors[Math.random()*colors.length|0];
  const rockets = [], parts = [], t0 = performance.now(); let last = t0, next = 0, raf = 0;
  const G = 0.12;
  const launch = () => rockets.push({x: W*(0.12 + Math.random()*0.76), y: H, vx: (Math.random()-0.5)*1.6, vy: -Math.sqrt(2*G*H*(0.45 + Math.random()*0.3)), c: pick()});
  const burst = r => { const n = 70 + (Math.random()*50|0), ring = Math.random() < 0.3;
    for(let i=0;i<n;i++){ const a = Math.PI*2*i/n + Math.random()*0.1, sp = ring ? 4.2 : 1.5 + Math.random()*4.2;
      parts.push({x:r.x, y:r.y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, d:0.009 + Math.random()*0.008, c: Math.random()<0.75 ? r.c : pick()}); } };
  function frame(now){
    const dt = Math.min(3, (now-last)/16.7); last = now; const el = now - t0;
    ctx.globalCompositeOperation = "destination-out"; ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
    if(el < ms-1600 && now > next){ launch(); if(Math.random()<0.45) launch(); next = now + 220 + Math.random()*380; }
    for(let i=rockets.length-1;i>=0;i--){ const r = rockets[i]; r.x += r.vx*dt; r.y += r.vy*dt; r.vy += G*dt;
      ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(r.x, r.y, 2.6, 0, 7); ctx.fill();
      if(r.vy >= -0.6){ burst(r); rockets.splice(i,1); } }
    for(let i=parts.length-1;i>=0;i--){ const q = parts[i]; q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 0.05*dt; q.vx *= 0.986; q.vy *= 0.986; q.life -= q.d*dt;
      if(q.life <= 0){ parts.splice(i,1); continue; }
      ctx.globalAlpha = q.life; ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, 2.1, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    if(el < ms || parts.length || rockets.length) raf = requestAnimationFrame(frame); else stop();
  }
  function stop(){ cancelAnimationFrame(raf); removeEventListener("resize", size); cv.remove(); fwStop = null; }
  fwStop = stop; raf = requestAnimationFrame(frame);
}

/* ---------- Timer ---------- */
function startTimer(sec, keepTotal){
  stopTimer();
  timer.left = sec; if(!keepTotal) timer.total = sec; timer.run = true;
  timer.h = setInterval(()=>{
    if(!timer.run) return;
    timer.left = Math.max(0, timer.left-1);
    if(timer.left===0){ timer.run=false; clearInterval(timer.h); beep(); }
    paintTimer();
  },1000);
}
function stopTimer(){ timer.run=false; clearInterval(timer.h); }
function toggleTimer(){
  if(timer.run){ timer.run=false; clearInterval(timer.h); }
  else if(timer.left>0){ startTimer(timer.left, true); }
  paintTimer();
}
function paintTimer(){
  const r = document.getElementById("ring"); if(!r) return;
  const ph = ui.view==="question" && game && game.cur ? game.cur.phase : "ask";
  const p = timer.total ? (timer.left/timer.total*100) : 0;
  r.style.setProperty("--p", p.toFixed(1));
  r.classList.toggle("low", timer.left<=10);
  r.classList.toggle("out", timer.left===0);
  r.querySelector("span").textContent = timer.left;
  const b = document.getElementById("tbtn");
  if(b){
    b.textContent = ph==="watch" ? "يبدأ بعد المقطع" : ph==="ready" ? "ينتظر البداية" : timer.run ? "إيقاف مؤقت" : (timer.left>0 ? "استئناف" : "انتهى الوقت");
    b.disabled = ph!=="ask" || timer.left===0;
  }
}
let actx=null;
function beep(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=660; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.18, actx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+t+.2); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.22); });
  }catch(e){}
}

function speakBtn(q){ return q && q.speak ? `<div class="speakrow"><button type="button" class="btn amber speakbtn" data-t="${esc(q.speak.t)}" data-l="${esc(q.speak.l)}" onclick="speakWord(this)">🔊 اسمع النطق</button><div class="muted speakmsg" hidden>جهازك ما عنده صوت لهذي اللغة. اقرأوا الكلمة من السؤال.</div></div>` : ""; }
function speakWord(btn){
  try{
    const syn = window.speechSynthesis, msg = btn.parentNode.querySelector(".speakmsg");
    if(!syn || typeof SpeechSynthesisUtterance==="undefined"){ if(msg) msg.hidden = false; return; }
    syn.cancel();
    const l = btn.dataset.l, vs = syn.getVoices() || [];
    const norm = x => String(x||"").replace("_","-").toLowerCase();
    const v = vs.find(x=>norm(x.lang)===norm(l)) || vs.find(x=>norm(x.lang).slice(0,2)===norm(l).slice(0,2));
    if(vs.length && !v){ if(msg) msg.hidden = false; return; }
    if(msg) msg.hidden = true;
    const u = new SpeechSynthesisUtterance(btn.dataset.t);
    u.lang = l; u.rate = 0.8; if(v) u.voice = v;
    syn.speak(u);
  }catch(e){}
}
if(window.speechSynthesis){ try{ window.speechSynthesis.getVoices(); }catch(e){} }

  if(q.once && cur.played) return `<div class="notice">انتهى المقطع، وما فيه إعادة 😉</div>`;
  const ctl = q.once ? "" : "controls";
  const el = m.kind==="video"
    ? `<video id="qmedia" class="qvideo" src="${esc(blobSrc(m.id))}" ${ctl} playsinline preload="auto"></video>`
    : `<div class="disc" aria-hidden="true">🔊</div><audio id="qmedia" src="${esc(blobSrc(m.id))}" ${ctl} preload="auto"></audio>`;
  return `<div class="mwrap" id="mwrap" data-key="${esc(q.id+":"+m.id)}">${el}
    ${q.once ? `<button class="btn amber playbtn" id="playbtn" data-act="play">▶ شغّل المقطع (مرة وحدة)</button>` : ""}
    <div class="muted" id="merr" hidden>ما قدرنا نشغّل المقطع. تأكدوا من الإنترنت وجربوا مرة ثانية.</div></div>`;
}

function rkPicks(cur){
  if(!cur.picks) cur.picks = {0: cur.pick || [], 1: []};

  return cur.picks;
}
function parseNum(v){
  if(v===null || v===undefined) return null;
  const t = String(v).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g, d => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[^\d.-]/g, "");
  if(!t || !/\d/.test(t)) return null;
  const n = parseFloat(t); return isFinite(n) ? n : null;
}
function choiceHTML(q, cur){

const rkRight = arr => arr.filter((ix,pos)=>ix===pos).length;
function rankHTML(q, cur){

function vQuestion(){
  const cur = game.cur; const t = game.board[cur.cat][cur.idx];
  const c = catById(cur.cat) || {name:"", icon:""};
  const q = qById(t.qid) || {id:"x", q:"هذا السؤال انحذف من بنك الأسئلة", a:"—"};
  const type = qType(q);
  const turnName = game.teams[game.turn].name;
  const notes = [];
  [0,1].forEach(i=>{
    if(cur.active[i+":two"]) notes.push(`✌️ ${esc(game.teams[i].name)} لهم محاولتين في هذا السؤال`);
    if(cur.active[i+":pit"]) notes.push(`🕳️ الحفرة مفعّلة لـ${esc(game.teams[i].name)}: لو جاوبوا صح، الخصم يخسر ${curPts(t)}`);
    if(cur.active[i+":call"]) notes.push(`📞 ${esc(game.teams[i].name)} اتصلوا بصديق (+30 ثانية)`);
  });

  let main = "";
  if(type==="charade"){
    if(cur.revealed) main += mediaHTML(q, cur);
    main += `<div class="qtext">${esc(q.q || "مثّل الشخص بدون ولا كلمة")}</div>`;
    if(!cur.revealed && cur.phase==="ready"){
      const link = secretLink(q);
      main += `<div class="qrbox">
        ${link ? `<div class="qr" id="qr" data-link="${esc(link)}" role="img" aria-label="باركود صورة الإجابة"></div>
        <div class="muted">اللي بيمثّل يمسح الباركود بجواله ويشوف الصورة والإجابة بروحه</div>` : ""}
        <div class="row" style="justify-content:center"><button class="btn" data-act="peek">اعرض الصورة للممثل بس</button><button class="btn amber" data-act="skipwatch">ابدأ الوقت · ${timer.total} ثانية</button></div></div>`;
    } else if(!cur.revealed){
      main += `<div class="watchmsg">مثّل بدون ولا كلمة 🤐</div>`;
    }
  } else {
    if(!(cur.revealed && q.ansMedia && q.ansMedia.id)) main += mediaHTML(q, cur);
    if(cur.phase==="watch"){
      main += q.guessQ
        ? `<div class="watchmsg">ركّزوا في كل شي 👀 السؤال ما بيطلع، ولازم تخمّنونه بعد المقطع</div>
        <button class="btn small ghost" data-act="skipwatch">خلص المقطع</button>`
        : `<div class="watchmsg">ركّزوا زين 👀 السؤال بيطلع بعد ما يخلص المقطع</div>
        <button class="btn small ghost" data-act="skipwatch">اعرض السؤال الحين</button>`;
    } else if(q.guessQ && !cur.revealed){
      main += `<div class="watchmsg">خمّنوا السؤال وجاوبوا عليه 🤔</div>
        <div class="muted">كل فريق يقول جوابه. النقاط لمن جوابه صح، حتى لو خمّن السؤال غلط</div>`;
    } else {
      main += `<div class="qtext ${type==="choice"?"poem":""} ${type!=="choice" && (q.q||"").length>110?"long":""}">${esc(q.q)}</div>`;
      if(type==="choice") main += choiceHTML(q, cur);
      if(type==="rank") main += rankHTML(q, cur);
      if(type==="closest" && !cur.revealed) main += guessHTML(cur);
    }
  }

  let answer = `<div class="answer">${esc(q.a)}</div>`;
  let winner = null;
  if(type==="choice"){
    const ok = [0,1].map(i => cur.cpick && cur.cpick[i]!==null && cur.cpick[i]!==undefined ? (q.choices||[])[cur.cpick[i]]===q.a : null);
    if(ok[0]!==null || ok[1]!==null){
      winner = ok[0] && ok[1] ? "tie" : ok[0] ? 0 : ok[1] ? 1 : null;
    }
    answer = `<div class="answer">${esc(q.a)}</div>
      ${winner==="tie" ? `<div class="muted">الفريقين جاوبوا صح</div>` : winner===null ? ((ok[0]===false||ok[1]===false) ? `<div class="muted">ولا فريق جاوب صح</div>` : "") : `<div class="answer">جاوب صح: ${esc(game.teams[winner].name)}</div>`}`;
  }
  if(type==="closest"){
    const g = cur.guess || {0:"",1:""};
    const target = Number(q.num);
    const d = [0,1].map(i => { const v = parseNum(g[i]); return v===null ? null : Math.abs(v - target); });
    if(d[0]!==null || d[1]!==null){
      winner = d[1]===null ? 0 : d[0]===null ? 1 : d[0]===d[1] ? "tie" : (d[0] < d[1] ? 0 : 1);
    }
    const rows = [0,1].filter(i=>parseNum(g[i])!==null).map(i=>`<div class="rkrow ${i?"b":""}"><b>${esc(game.teams[i].name)}</b>
      <span class="gval">${esc(parseNum(g[i]))}</span><span class="rkcnt">${d[i]===0 ? "بالضبط!" : "الفرق " + d[i]}</span></div>`).join("");
    answer = `<div class="answer">${esc(q.a)}</div>${rows ? `<div class="rkres">${rows}</div>` : ""}
      ${winner===null ? "" : winner==="tie" ? `<div class="muted">تعادل في القرب</div>` : `<div class="answer">الأقرب: ${esc(game.teams[winner].name)}</div>`}`;
  }
  if(type==="rank"){
    const items = q.items || [];
    const picks = rkPicks(cur);
    const r0 = rkRight(picks[0]), r1 = rkRight(picks[1]);
    const any = picks[0].length || picks[1].length;
    winner = !any ? null : r0===r1 ? "tie" : (r0>r1 ? 0 : 1);
    answer = `<div class="muted">الترتيب الصحيح</div><ol class="rankans">${items.map((it,i)=>`<li><b>${i+1}</b>${esc(it)}</li>`).join("")}</ol>
      ${winner===null ? "" : winner==="tie" ? `<div class="answer">تعادل: ${r0} صح لكل فريق</div>` : `<div class="answer">الفوز ${esc(li(game.teams[winner].name))}: ${winner?r1:r0} صح مقابل ${winner?r0:r1}</div>`}`;
  }
  const finish = cur.phase!=="ask" ? "" : cur.revealed
    ? `${ansMediaHTML(q)}${answer}
       <div class="muted">من جاوب صح؟</div>
       <div class="who">
         <button class="btn primary ${winner===0?"win":""}" data-act="award" data-t="0">${esc(game.teams[0].name)}</button>
         <button class="btn amber ${winner===1?"win":""}" data-act="award" data-t="1">${esc(game.teams[1].name)}</button>
         <button class="btn" data-act="award" data-t="none">ولا أحد</button>
       </div>`
    : `<button class="btn primary" data-act="reveal" style="font-size:18px;padding:14px 34px">${q.guessQ ? "اكشف السؤال والإجابة" : "اكشف الإجابة"}</button>`;

  return `<div class="view game">${topbar(`<button class="btn small ghost" data-act="back">رجوع للوحة</button>`)}
  ${scoreboard(!cur.revealed)}
  <div class="qwrap">
    <div class="qhead"><div class="cat"><span>${esc(c.icon)}</span>${esc(c.name)} <span class="pill">${curPts(t)!==t.pts ? `<s class="was">${t.pts}</s>${curPts(t)}` : t.pts}</span></div>
      <div class="timer"><span class="muted">دور ${esc(turnName)}</span><div class="ring" id="ring"><span>${timer.left}</span></div>
        <button class="btn small" id="tbtn" data-act="timer">إيقاف مؤقت</button>${cur.phase==="ask"?`<button class="btn small ghost" data-act="retime">من جديد</button>`:""}</div></div>
    <div class="qcard">
      ${main}
      ${hintsHTML(q,cur,t)}
      ${notes.length?`<div class="row" style="justify-content:center">${notes.map(n=>`<span class="notice">${n}</span>`).join("")}</div>`:""}
      ${finish}
      ${q.credit ? `<div class="credit">${esc(q.credit).replace(/@[\w.]+/g, m=>`<bdi dir="ltr">${m}</bdi>`)}</div>` : ""}
    </div>
  </div>
  ${ui.peek ? peekHTML(q) : ""}</div>`;
}

function peekHTML(q){
  const m = mediaOf(q);
  return `<div class="peek" data-act="unpeek" role="dialog" aria-label="صورة الشخص">
    ${m && m.kind==="image" ? `<img src="${esc(blobSrc(m.id))}" alt="">` : ""}
    <div class="pname">${esc(q.a)}</div>
    <div class="muted">اضغط أي مكان عشان تخفيها</div></div>`;
}

function previewHTML(m){
  const src = esc(blobSrc(m.id));
  if(m.kind==="image") return `<img class="pv" src="${src}" alt="معاينة">`;
  if(m.kind==="video") return `<video class="pv" src="${src}" controls playsinline preload="metadata"></video>`;
  return `<audio src="${src}" controls preload="metadata"></audio>`;
}
function mediaTag(q){
  const type = qType(q);
  let s = (q.ansMedia && q.ansMedia.id ? `<span class="tag">+ مقطع مع الإجابة</span> ` : "") + (type==="closest" ? `<span class="tag">الأقرب يفوز</span> ` : "");
  if(type==="rank") s += `<span class="tag">ترتيب · ${(q.items||[]).length} أسماء</span> `;
  if(type==="charade") s += `<span class="tag">ولا كلمة · ${qSecs(q)} ثانية</span> `;
  if(type==="choice") s += `<span class="tag">اختيارات: ${esc((q.choices||[]).filter(c=>c!==q.a).join("، "))}</span> `;
  const m = mediaOf(q);
  if(!m) return s + (q.e ? esc(q.e)+" " : "");
  if(m.kind==="image") return s + `<img src="${esc(blobSrc(m.id))}" alt=""> `;
  return s + `<span class="tag">${m.kind==="video"?"🎬 فيديو":"🔊 صوت"}${q.guessQ?" · خمّن السؤال":q.hideQ?" · السؤال بعد المقطع":""}${q.once?" · مرة وحدة":""}</span> `;
}
function usageHTML(){
  const u = ui.usage; if(!u) return "";
  const mb = b => (b/1048576).toFixed(b < 10485760 ? 1 : 0);
  const pct = u.maxBytes ? Math.min(100, u.bytes/u.maxBytes*100) : 0;
  return `<div class="usage"><div class="row" style="justify-content:space-between"><span>مساحة الملفات</span><span class="count">${mb(u.bytes)}${u.maxBytes?" / "+mb(u.maxBytes):""} ميغا</span></div>
    ${u.maxBytes?`<div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>`:""}
    <span class="muted" style="font-size:12px">${u.files} ملف${u.maxFiles?" من أصل "+u.maxFiles:""}</span></div>`;
}

      ${coverRow}

      ${editable && !cat.builtin ? `<div class="row" style="margin-top:12px">${ui.confirmDel==="cat:"+cat.id
        ? `<div class="confirm">تنحذف الفئة وكل أسئلتها (${qs.length})؟ <button class="btn small primary" data-act="delcat-yes">احذف</button><button class="btn small" data-act="nodel">لا</button></div>`

    </section>

/* ---------- Events ---------- */
function setStatus(msg, kind){ ui.status = msg; ui.statusKind = kind||""; const s = document.querySelector(".status"); if(s){ s.textContent = msg; s.className = "status "+(kind||""); } }

app.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const a = b.dataset.act;
  if(a==="home"){ stopTimer(); ui.view = "home"; ui.confirmEnd=false; ui.peek=false; render(); }
  else if(a==="setup"){ ui.view="setup"; render(); }
  else if(a==="homerand"){ ui.pickCats = shuffle(allCats().filter(c=>questionsOf(c.id).length>=6).map(c=>c.id)).slice(0,6); render(); }
  else if(a==="clearpicks"){ ui.pickCats = []; render(); }
  else if(a==="gocats"||a==="goteams"||a==="goletters"){ const el = document.getElementById(a==="gocats"?"cats":a==="goteams"?"teams":"letters"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); }
  else if(a==="homecat"){ const id = b.dataset.id; if(!ui.pickCats.includes(id) && ui.pickCats.length<6) ui.pickCats = ui.pickCats.concat(id); ui.view="setup"; render(); }
  else if(a==="homepack"){ ui.lpack = b.dataset.k; ui.view="lsetup"; render(); }
  else if(a==="lettersmenu" || a==="lsetupv"){ stopTimer(); ui.view="lsetup"; render(); }
  else if(a==="lstart"){ startLetters(); }
  else if(a==="lpack"){ ui.lpack = b.dataset.k; render(); }
  else if(a==="lresume"){ lg = lsGet(LSL); if(!lg) return; if(lg.cur){ ui.view="lq"; startTimer(lg.secs||ui.lsecs); } else ui.view="letters"; render(); }
  else if(a==="lcell"){ const i = +b.dataset.i; if(!lg || lg.cells[i].o!==null || lg.winner!==null) return; lg.cur = {i, qid: pickLetterQ(lg.cells[i].l), revealed:false}; saveLg(); ui.view="lq"; startTimer(lg.secs||ui.lsecs); render(); }
  else if(a==="lswap"){ lg.cur.qid = pickLetterQ(lg.cells[lg.cur.i].l, lg.cur.qid); saveLg(); startTimer(lg.secs||ui.lsecs); render(); }
  else if(a==="lreveal"){ lg.cur.revealed = true; stopTimer(); saveLg(); render(); }
  else if(a==="lretime"){ startTimer(lg.secs||ui.lsecs); paintTimer(); }
  else if(a==="laward"){
    const t = b.dataset.t==="none" ? null : +b.dataset.t, i = lg.cur.i;
    let won = false;

    if(m && (!old || old.id!==m.id)) cleanupAsset(m.id, ui.form.id?[ui.form.id]:[]);

    }catch(err){ ui.status = "ما قدرنا نشيل الصورة، حاول مرة ثانية"; ui.statusKind = "err"; }
    render();

function classifyFile(file, imageOnly){
  const name = (file.name||"").toLowerCase(), type = file.type || "";
  if(/^image\//.test(type)) return {kind:"image"};
  if(imageOnly) return {err:"هنا تحتاج صورة (JPG أو PNG)."};
  if(type==="video/mp4" || (!type && name.endsWith(".mp4"))) return {kind:"video", type:"video/mp4"};
  if(type==="video/webm" || (!type && name.endsWith(".webm"))) return {kind:"video", type:"video/webm"};
  if(/^video\//.test(type) || /\.(mov|avi|mkv|3gp)$/.test(name)) return {err:"صيغة الفيديو هذي ما تنرفع (مثل MOV من الآيفون). حوّلها MP4، أو أرسلها لـClaude يحوّلها لك."};
  if(/^audio\//.test(type) || /\.(mp3|m4a|wav|ogg|opus|aac|amr|weba)$/.test(name)) return {err:"ملفات الصوت (MP3 وM4A وتسجيلات الواتساب) ما تنرفع مباشرة. أرسلها لـClaude يحوّلها، أو صوّرها فيديو MP4 من الجوال واختر طريقة العرض: صوت فقط."};
  return {err:"نوع الملف غير مدعوم. استخدم صورة (JPG أو PNG) أو فيديو MP4."};
}
const UPLOAD_ERR = {unsupported_type:"نوع الملف غير مدعوم (صور الآيفون HEIC مثلاً). حوّلها JPG وجرب مرة ثانية.", too_large:"الملف كبير جداً، الحد 20 ميغا.", rate_limited:"انتظر شوي وحاول مرة ثانية.", quota_or_state:"مساحة الملفات ممتلئة. احذف أسئلة قديمة فيها مقاطع وجرب مرة ثانية.", store_unavailable:"صار خلل مؤقت، جرب مرة ثانية."};

app.addEventListener("change", async e => {
  const id = e.target.id;
  if(id==="secs") ui.seconds = +e.target.value;
  else if(id==="f-l") ui.form.level = +e.target.value;
  else if(id==="f-kind"){ if(ui.form.media) ui.form.media = {...ui.form.media, kind:e.target.value}; render(); }
  else if(id==="f-hide") ui.form.hideQ = e.target.checked;
  else if(id==="f-once") ui.form.once = e.target.checked;
  else if(id==="f-guess") ui.form.guessQ = e.target.checked;
  else if(id==="f-closest") ui.form.closest = e.target.checked;
  else if(id==="f-letter") ui.form.letter = e.target.value;
  else if(id==="lsecs") ui.lsecs = +e.target.value;
  else if(id==="f-media" || id==="f-cover" || id==="f-ans"){
    const file = e.target.files && e.target.files[0]; if(!file) return;
    const cat = catById(ui.adminCat);
    const c = classifyFile(file, id==="f-cover" || (id==="f-media" && cat.kind==="charade"));
    if(c.err){ setStatus(c.err, "err"); e.target.value=""; return; }
    if(file.size > 20*1024*1024){ setStatus(`حجم الملف ${(file.size/1048576).toFixed(0)} ميغا، والحد 20 ميغا. قصّ المقطع أو صغّر جودته.`, "err"); e.target.value=""; return; }
    ui.uploading = true;
    e.target.disabled = true;
    const sv = document.getElementById("f-save"); if(sv) sv.disabled = true;
    setStatus(c.kind==="image" ? "جاري رفع الصورة…" : "جاري رفع المقطع… ممكن ياخذ دقيقة");
    try{
      const r = await store.assets.upload(file, c.type ? {type:c.type} : undefined);
      if(id==="f-cover"){
        const old = cat.cover;
        if(cat.builtin) await store.db.doc("cats/"+cat.id).set({override:true, cover:r.id});
        else await store.db.doc("cats/"+cat.id).update({cover:r.id});
        if(old) cleanupAsset(old, [], cat.id);
        ui.status = "انحفظت صورة الفئة"; ui.statusKind = "ok";
      } else if(id==="f-ans"){
        const prev = ui.form.ans, old = ui.form.oldAns;
        ui.form.ans = {id:r.id, kind:c.kind};
        if(prev && (!old || old.id!==prev.id)) cleanupAsset(prev.id, ui.form.id?[ui.form.id]:[]);
        ui.status = "انرفع مقطع الإجابة. اضغط " + (ui.form.id ? "حفظ التعديل" : "أضف السؤال") + " عشان ينحفظ."; ui.statusKind="ok";
      } else {
        const prev = ui.form.media, old = ui.form.oldMedia;
        ui.form.media = {id:r.id, kind:c.kind};
        if(prev && (!old || old.id!==prev.id)) cleanupAsset(prev.id, ui.form.id?[ui.form.id]:[]);
        ui.status = (c.kind==="image" ? "انرفعت الصورة" : "انرفع المقطع") + ". اضغط " + (ui.form.id ? "حفظ التعديل" : "أضف السؤال") + " عشان ينحفظ."; ui.statusKind="ok";
      }
    }catch(err){
      ui.status = UPLOAD_ERR[err && err.code] || "ما قدرنا نرفع الملف، حاول مرة ثانية."; ui.statusKind="err";
    }
    ui.uploading = false;
    render(); refreshUsage();
  }
});

app.addEventListener("submit", async e => {
  e.preventDefault();
  if(e.target.id==="newcat"){
    const name = document.getElementById("nc-name").value.trim();
    const icon = document.getElementById("nc-icon").value.trim() || ({rank:"🔢", charade:"🤐", choice:"🎙️"}[document.getElementById("nc-kind").value] || "⭐");
    const kind = document.getElementById("nc-kind").value || "normal";
    if(!name) return;
    try{
      const ref = store.db.collection("cats").doc();
      await ref.set({name, icon, kind, cover:"", created:Date.now()});
      ui.adminCat = ref.id; discardForm(); ui.status = "انضافت الفئة، أضف لها 6 أسئلة على الأقل"; ui.statusKind="ok";
    }catch(err){ ui.status="ما قدرنا نضيف الفئة"; ui.statusKind="err"; }
    render();
  }
  if(e.target.id==="qform"){
    if(ui.uploading) return;
    const cat = catById(ui.adminCat);
    const kind = cat.kind || "normal";
    const f = ui.form;
    const m = f.media;
    let q = f.q.trim(), a = f.a.trim(), items = [];
    if(kind==="rank"){
      items = f.items.map(x=>(x||"").trim()).filter(Boolean);
      if(items.length < 3){ setStatus("اكتب 3 أسماء على الأقل بالترتيب الصحيح", "err"); return; }
      a = items.map((x,i)=>`${i+1}. ${x}`).join("  ");
    }
    let choices = null;
    if(kind==="choice"){
      const wrong = f.items.slice(0,3).map(x=>(x||"").trim()).filter(Boolean);
      if(wrong.length < 2){ setStatus("اكتب اختيارين غلط على الأقل", "err"); return; }
      choices = [a, ...wrong];
    }
    if(kind==="charade"){
      if(!m || m.kind!=="image"){ setStatus("أضف صورة الشخص أول", "err"); return; }
      if(!q) q = "مثّل الشخص بدون ولا كلمة";
    }
    if(!q || !a) return;
    if(kind==="letters"){
      const LSx = packLetters(packOfCat(ui.adminCat));
      const L = LSx.includes(f.letter) ? f.letter : LSx[0];
      const body = {cat: ui.adminCat==="letters" ? "letters-general" : ui.adminCat, type:"letter", pack: packOfCat(ui.adminCat), letter:L, level:1, q, a, e:"", img:"", items:[], media:null, ansMedia:null, hideQ:false, once:false, num:null, created: f.created || Date.now()};
      try{
        if(f.id) await store.db.doc("qs/"+f.id).set(body); else await store.db.collection("qs").doc().set(body);
        const wasEdit = !!f.id; ui.form = {...emptyForm(), letter:L};
        ui.status = wasEdit ? "انحفظ التعديل" : "انضاف السؤال لحرف " + L; ui.statusKind = "ok";
      }catch(err){ ui.status = "ما قدرنا نحفظ السؤال، حاول مرة ثانية"; ui.statusKind = "err"; }
      render(); return;
    }
    const isClosest = kind==="normal" && !!f.closest;
    const num = isClosest ? parseNum(a) : null;
    if(isClosest && num===null){ setStatus("في سؤال الأقرب يفوز، اكتب الإجابة رقم أو سنة", "err"); return; }
    const body = {cat:ui.adminCat, type: isClosest ? "closest" : kind, num, choices, level:+f.level||1, q, a, e:kind==="normal" ? (f.e||"").trim() : "", img:"", items,
      media: m ? {id:m.id, kind:m.kind} : null,
      ansMedia: (kind!=="charade" && f.ans) ? {id:f.ans.id, kind:f.ans.kind} : null,
      hideQ: isAV(m) ? (!!f.hideQ || !!f.guessQ) : false, once: isAV(m) ? !!f.once : false, guessQ: isAV(m) ? !!f.guessQ : false,
      created: f.created || Date.now()};
    const btn = document.getElementById("f-save"); if(btn) btn.disabled = true;
    try{
      if(f.id) await store.db.doc("qs/"+f.id).set(body);
      else await store.db.collection("qs").doc().set(body);
      const old = f.oldMedia, wasEdit = !!f.id, oldAn = f.oldAns, an = body.ansMedia;
      ui.form = emptyForm();
      if(old && (!m || old.id!==m.id)) cleanupAsset(old.id, wasEdit?[f.id]:[]);
      if(oldAn && (!an || oldAn.id!==an.id)) cleanupAsset(oldAn.id, wasEdit?[f.id]:[]);
      ui.status = wasEdit ? "انحفظ التعديل" : "انضاف السؤال"; ui.statusKind="ok";
    }catch(err){
      ui.status = err && err.code==="quota_exceeded" ? "وصلت الحد الأقصى للأسئلة" : "ما قدرنا نحفظ السؤال، حاول مرة ثانية"; ui.statusKind="err";
    }
    render();
  }
});

/* team 0 (red) connects right↔left, team 1 (gold) connects top↔bottom */
function hasPath(team){
  const isStart = i => team===0 ? i%5===0 : i<5, isEnd = i => team===0 ? i%5===4 : i>=20;
  const st = [...Array(25).keys()].filter(i=>lg.cells[i].o===team && isStart(i)), seen = new Set(st);
  while(st.length){ const i = st.pop(); if(isEnd(i)) return true; for(const n of hexNbrs(i)) if(!seen.has(n) && lg.cells[n].o===team){ seen.add(n); st.push(n); } }
  return false;
}
function pickLetterQ(l, exclude){
  const pool = letterQs(l).filter(q=>q.id!==exclude);
  if(!pool.length) return exclude || null;
  const used = lsGet(LSLU) || [];
  const fresh = pool.filter(q=>!used.includes(q.id));
  const q = shuffle(fresh.length ? fresh : pool)[0];
  lsSet(LSLU, used.filter(x=>x!==q.id).concat(q.id).slice(-300));
  return q.id;
}
function startLetters(){
  const prevLg = lsGet(LSL);
  lg = {teams:[ui.teamA.trim()||"الفريق الأحمر", nameB(ui.teamB,true)], pack: LETTER_PACKS[ui.lpack] ? ui.lpack : "general", cells:[], rounds:[0,0], turn:0, cur:null, winner:null, secs:ui.lsecs};
  lg.cells = newBoard(prevLg && prevLg.pack===lg.pack ? prevLg.cells : null);
  saveLg(); ui.view = "letters"; render();
}

function hexBoardHTML(clickable){
  const rows = [0,1,2,3,4].map(r=>`<div class="hrow ${r%2?"odd":""}">${[0,1,2,3,4].map(c=>{
    const i = r*5+c, cell = lg.cells[i];
    const cls = cell.o===0 ? "t0" : cell.o===1 ? "t1" : "";
    const can = clickable && cell.o===null && lg.winner===null;
    return `<button class="hex ${cls} ${lg.cur&&lg.cur.i===i?"cur":""}" data-act="lcell" data-i="${i}" ${can?"":"disabled"} aria-label="حرف ${esc(cell.l)}"><span>${esc(cell.l)}</span></button>`;
  }).join("")}</div>`).join("");
  return `<div class="hexwrap" dir="ltr"><div class="hexboard">${rows}</div></div>`;
}

function lScore(){
  return `<div class="score lscore">
    ${[0,1].map(i=>`<div class="tm ${i?"b":""} ${lg.turn===i&&lg.winner===null?"turn":""}"><div class="nm"><span>${esc(lg.teams[i])}</span>${lg.turn===i&&lg.winner===null?`<span class="badge">يختار الحرف</span>`:""}</div>
      <div class="ptsrow"><span class="pts">${lg.rounds[i]}</span><span class="muted">${i?"↕ من فوق لتحت":"↔ من اليمين لليسار"}</span></div></div>`).join(`<div class="mid"><div class="left">${esc((LETTER_PACKS[curPack()]||{}).icon||"")} ${esc((LETTER_PACKS[curPack()]||{}).name||"")}<br>جولات</div><button class="btn small ghost" data-act="lturn">بدّل الدور</button></div>`)}
  </div>`;
}

/* phone view for "ولا كلمة": the QR opens the site at #w-<question id> */
function readHash(){
  let h = location.hash || "";
  try{ const w = new URLSearchParams(location.search).get("w"); if(w) h = "#w-" + w; }catch(e){}
  const d = /^#w-([0-9a-f]{32})-([A-Za-z0-9_-]+)$/.exec(h);
  if(d){ ui.view = "secret"; ui.secret = {img:d[1], a:unb64u(d[2])}; ui.secretId = null; ui.secretHidden = false; return true; }
  const m = /^#w-([A-Za-z0-9._~-]{1,120})$/.exec(h);
  if(m){ ui.view = "secret"; ui.secret = null; ui.secretId = m[1]; ui.secretHidden = false; return true; }
  return false;
}
window.addEventListener("hashchange", () => { if(readHash()) render(); });

/* keep a running game across live updates of the page */
window.claude?.hot?.snapshot?.(() => ({game, lg, ui:{...ui, uploading:false}, timer:{left:timer.left,total:timer.total}}));
function start(data){
  if(data && data.ui) ui = {...ui, ...data.ui, form: {...emptyForm(), ...(data.ui.form||{})}, uploading:false};
  if(data && data.game){
    game = data.game;
    if(data.timer && game.cur){
      timer.total = data.timer.total;
      if(game.cur.phase && game.cur.phase!=="ask") timer.left = data.timer.left;
      else startTimer(data.timer.left, true);
    }
  }
  lg = (data && data.lg) || lsGet(LSL);
  if(ui.view==="lq"){ if(lg && lg.cur) startTimer((data && data.timer && data.timer.left) || lg.secs || ui.lsecs); else ui.view = lg ? "letters" : "home"; }
  if((ui.view==="letters" || ui.view==="lsetup") && !lg && ui.view==="letters") ui.view = "lsetup";
  readHash();
  render(); initStore();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
