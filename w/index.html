<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>فنجان · ولا كلمة</title>
<style>
  :root{--red:#c8102e;--violet:#6b2fb3;--fg:#1d1b22;--muted:#6d6878}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 18px;background:#fff;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;text-align:center}
  .brand{font-weight:800;color:var(--red);font-size:20px}
  .card{width:min(92vw,420px);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#f3f1f6}
  .card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
  .name{font-size:clamp(30px,9vw,44px);font-weight:900;margin:14px 0 8px;line-height:1.2}
  .tip{color:var(--muted);font-size:16px;margin:0}
  button{font:inherit;font-size:18px;font-weight:700;border:0;border-radius:14px;padding:14px 26px;background:var(--violet);color:#fff;cursor:pointer}
  .hidden-msg{font-size:22px;font-weight:700}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="brand">فنجان ☕ ولا كلمة</div>
  <div id="show" hidden>
    <div class="card"><img id="img" alt="صورة اللاعب"></div>
    <p class="name" id="name"></p>
    <p class="tip">لا تخلّي أحد يشوف شاشتك 🤫 ومثّل بدون ولا كلمة</p>
    <p><button id="hide">خلصت، أخفِ الصورة</button></p>
  </div>
  <div id="gone" hidden>
    <p class="hidden-msg">الصورة مخفية 🤐</p>
    <p><button id="again">اعرضها مرة ثانية</button></p>
  </div>
  <p id="err" class="tip" hidden>الرابط ناقص. امسحوا الباركود مرة ثانية.</p>
<script>
  /* link format: #<image file>-<name as base64url> */
  function unb64u(s){ try{ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const b=atob(s); return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0))); }catch(e){ return ""; } }
  const h = decodeURIComponent(location.hash.slice(1)), i = h.indexOf("-");
  const file = i>0 ? h.slice(0,i) : "", name = i>0 ? unb64u(h.slice(i+1)) : "";
  const $ = id => document.getElementById(id);
  if(/^[0-9a-f]{8}$/.test(file)){
    $("img").src = "../wk/" + file + ".jpg";
    $("name").textContent = name;
    $("show").hidden = false;
  } else { $("err").hidden = false; }
  $("hide").onclick = () => { $("show").hidden = true; $("gone").hidden = false; };
  $("again").onclick = () => { $("gone").hidden = true; $("show").hidden = false; };
</script>
</body>
</html>
